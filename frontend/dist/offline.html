<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#104477" />
    <title>Merchtyl offline</title>
    <style>
      :root {
        color: #10233D;
        background: #F5F9FD;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 520px);
        border: 1px solid #D9E6F2;
        border-radius: 12px;
        background: #ffffff;
        padding: 28px;
        box-shadow: 0 16px 48px rgba(15, 23, 42, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #104477;
        font-weight: 800;
        margin-bottom: 24px;
      }

      img {
        width: 40px;
        height: 40px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
        line-height: 1.2;
      }

      p {
        margin: 0;
        color: #64748B;
        line-height: 1.6;
      }

      button {
        margin-top: 24px;
        border: 0;
        border-radius: 8px;
        background: #1473E6;
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/branding/Full main.svg" alt="Merchtyl" style="width:150px;height:auto" />
      </div>
      <h1>Merchtyl is offline</h1>
      <p>The app shell is available, but checkout, register actions, lottery transactions, and live reports require a connection.</p>
      <button type="button" onclick="window.location.reload()">Retry connection</button>
    </main>
  </body>
</html>
