spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/merchtyl
    username: merchtyl
    password: merchtyl_dev_password

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.merchtyl: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.transaction.interceptor: TRACE

merchtyl:
  jwt:
    issuer: merchtyl-local
    secret: merchtyl-local-jwt-secret-change-for-your-machine-9xK7pQ2m
  security:
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
  testing:
    user-provisioning:
      enabled: true
      key: merchtyl-local-test-key
      default-user-password: Test1234!
  email:
    provider: console
    frontend-base-url: http://localhost:5173
    resend:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

