spring:
  datasource:
    url: jdbc:postgresql://localhost:1/merchtyl_test
    username: merchtyl_test
    password: merchtyl_test
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

merchtyl:
  jwt:
    secret: test-secret-change-this-development-secret
  security:
    cors:
      allowed-origins: http://localhost:5173
    rate-limit:
      enabled: true
      auth-max-attempts: 20
      auth-window: 1m
