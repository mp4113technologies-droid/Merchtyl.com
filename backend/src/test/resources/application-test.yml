spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

merchtyl:
  jwt:
    secret: ${MERCHTYL_JWT_SECRET}
  security:
    cors:
      allowed-origins: http://localhost:5173
    rate-limit:
      enabled: true
      auth-max-attempts: 20
      auth-window: 1m
