spring:
  config:
    # Reuse the developer's ignored local datasource and provider settings when
    # this example profile is selected. Environment variables can still override them.
    import: optional:classpath:application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.merchtyl: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG

merchtyl:
  jwt:
    issuer: merchtyl-local
    secret: ${MERCHTYL_JWT_SECRET}
  security:
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1.nip.io:5173,http://localhost:8080
  testing:
    user-provisioning:
      enabled: true
      key: ${MERCHTYL_TEST_USER_PROVISIONING_KEY:}
      default-user-password: ${MERCHTYL_TEST_DEFAULT_USER_PASSWORD:}
  email:
    provider: ${MERCHTYL_EMAIL_PROVIDER:console}
    from-address: ${MERCHTYL_EMAIL_FROM_ADDRESS:}
    frontend-base-url: http://localhost:5173
    resend:
      enabled: ${RESEND_ENABLED:false}
      api-key: ${RESEND_API_KEY:}
  contact:
    email-to: ${MERCHTYL_CONTACT_EMAIL_TO:adviamcreatives@gmail.com}
    email-from: ${MERCHTYL_CONTACT_EMAIL_FROM:onboarding@resend.dev}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
