spring:
  config:
    # For local execution, copy this file to application-local.yml or keep an
    # ignored application-local.yml containing local secrets. The optional
    # import lets SPRING_PROFILES_ACTIVE=local.example use that file without
    # committing credentials to this example.
    import: optional:classpath:application-local.yml
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/merchtyl}
    username: ${SPRING_DATASOURCE_USERNAME:merchtyl}
    password: ${SPRING_DATASOURCE_PASSWORD:}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.merchtyl: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG

merchtyl:
  jwt:
    issuer: merchtyl-local
    secret: ${MERCHTYL_JWT_SECRET:replace-with-a-local-secret-at-least-32-characters}
  security:
    cors:
      allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080
  testing:
    user-provisioning:
      enabled: true
      key: ${MERCHTYL_TEST_USER_PROVISIONING_KEY:}
      default-user-password: ${MERCHTYL_TEST_DEFAULT_USER_PASSWORD:}
  email:
    provider: ${MERCHTYL_EMAIL_PROVIDER:console}
    from-address: ${MERCHTYL_EMAIL_FROM_ADDRESS:}
    frontend-base-url: http://localhost:5173
    resend:
      enabled: ${RESEND_ENABLED:false}
      api-key: ${RESEND_API_KEY:}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
