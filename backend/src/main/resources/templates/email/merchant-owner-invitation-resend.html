<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Your new Merchtyl activation link</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
<h1 style="color: #0f766e;">Merchtyl</h1>
<p>Hello {{ownerName}},</p>
<p>A new activation link was requested for <strong>{{merchantOperatingName}}</strong>.</p>
<p>
    <a href="{{activationUrl}}" style="background: #0f766e; color: #ffffff; padding: 12px 18px; text-decoration: none; border-radius: 6px; display: inline-block;">
        Activate account with new link
    </a>
</p>
<p>Plain activation URL:</p>
<p><a href="{{activationUrl}}">{{activationUrl}}</a></p>
<p>This new invitation expires at {{expiresAt}}.</p>
<p>For your security, any previous unused activation link no longer works.</p>
</body>
</html>
