services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merchtyl}
      POSTGRES_USER: ${POSTGRES_USER:-merchtyl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-merchtyl_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-merchtyl}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-merchtyl}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-merchtyl_dev_password}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-1}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-300000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-900000}
      MERCHTYL_JWT_SECRET: ${MERCHTYL_JWT_SECRET:-local-compose-secret-change-before-production-use-32-chars}
      MERCHTYL_JWT_EXPIRATION_MINUTES: ${MERCHTYL_JWT_EXPIRATION_MINUTES:-60}
      MERCHTYL_JWT_REFRESH_EXPIRATION_DAYS: ${MERCHTYL_JWT_REFRESH_EXPIRATION_DAYS:-14}
      MERCHTYL_CORS_ALLOWED_ORIGINS: ${MERCHTYL_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}
      MERCHTYL_RATE_LIMIT_ENABLED: ${MERCHTYL_RATE_LIMIT_ENABLED:-true}
      MERCHTYL_RATE_LIMIT_AUTH_MAX_ATTEMPTS: ${MERCHTYL_RATE_LIMIT_AUTH_MAX_ATTEMPTS:-20}
      MERCHTYL_RATE_LIMIT_AUTH_WINDOW: ${MERCHTYL_RATE_LIMIT_AUTH_WINDOW:-1m}
      MERCHTYL_IDEMPOTENCY_RETENTION: ${MERCHTYL_IDEMPOTENCY_RETENTION:-24h}
      MERCHTYL_BOOTSTRAP_ADMIN_ENABLED: ${MERCHTYL_BOOTSTRAP_ADMIN_ENABLED:-true}
      MERCHTYL_BOOTSTRAP_ADMIN_EMAIL: ${MERCHTYL_BOOTSTRAP_ADMIN_EMAIL:-admin@merchtyl.local}
      MERCHTYL_BOOTSTRAP_ADMIN_NAME: ${MERCHTYL_BOOTSTRAP_ADMIN_NAME:-Local Platform Admin}
      MERCHTYL_BOOTSTRAP_ADMIN_PASSWORD: ${MERCHTYL_BOOTSTRAP_ADMIN_PASSWORD:-AdminLocal!2026}
      MERCHTYL_EMAIL_PROVIDER: ${MERCHTYL_EMAIL_PROVIDER:-resend}
      MERCHTYL_EMAIL_FROM_ADDRESS: ${MERCHTYL_EMAIL_FROM_ADDRESS:-onboarding@adityabhosale.xyz}
      MERCHTYL_EMAIL_FROM_NAME: ${MERCHTYL_EMAIL_FROM_NAME:-Merchtyl}
      MERCHTYL_EMAIL_REPLY_TO: ${MERCHTYL_EMAIL_REPLY_TO:-}
      MERCHTYL_FRONTEND_BASE_URL: ${MERCHTYL_FRONTEND_BASE_URL:-http://localhost:5173}
      RESEND_ENABLED: ${RESEND_ENABLED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY in .env}
      LOGGING_LEVEL_COM_MERCHTYL: ${LOGGING_LEVEL_COM_MERCHTYL:-DEBUG}
      LOGGING_LEVEL_HIBERNATE_SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:-DEBUG}
      LOGGING_LEVEL_HIBERNATE_BIND: ${LOGGING_LEVEL_HIBERNATE_BIND:-WARN}
      LOGGING_LEVEL_JDBC_TEMPLATE: ${LOGGING_LEVEL_JDBC_TEMPLATE:-DEBUG}
      LOGGING_LEVEL_TRANSACTION: ${LOGGING_LEVEL_TRANSACTION:-TRACE}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

volumes:
  postgres-data:
