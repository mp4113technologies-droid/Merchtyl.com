services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-merchtyl}
      POSTGRES_USER: ${POSTGRES_USER:-merchtyl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-merchtyl}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-merchtyl}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DB_MAX_POOL_SIZE: ${DB_MAX_POOL_SIZE:-10}
      DB_MIN_IDLE: ${DB_MIN_IDLE:-1}
      DB_CONNECTION_TIMEOUT_MS: ${DB_CONNECTION_TIMEOUT_MS:-30000}
      DB_IDLE_TIMEOUT_MS: ${DB_IDLE_TIMEOUT_MS:-300000}
      DB_MAX_LIFETIME_MS: ${DB_MAX_LIFETIME_MS:-900000}
      MERCHTYL_JWT_SECRET: ${MERCHTYL_JWT_SECRET:?MERCHTYL_JWT_SECRET is required}
      MERCHTYL_JWT_EXPIRATION_MINUTES: ${MERCHTYL_JWT_EXPIRATION_MINUTES:-60}
      MERCHTYL_JWT_REFRESH_EXPIRATION_DAYS: ${MERCHTYL_JWT_REFRESH_EXPIRATION_DAYS:-14}
      MERCHTYL_CORS_ALLOWED_ORIGINS: ${MERCHTYL_CORS_ALLOWED_ORIGINS:?MERCHTYL_CORS_ALLOWED_ORIGINS is required}
      MERCHTYL_RATE_LIMIT_ENABLED: ${MERCHTYL_RATE_LIMIT_ENABLED:-true}
      MERCHTYL_RATE_LIMIT_AUTH_MAX_ATTEMPTS: ${MERCHTYL_RATE_LIMIT_AUTH_MAX_ATTEMPTS:-20}
      MERCHTYL_RATE_LIMIT_AUTH_WINDOW: ${MERCHTYL_RATE_LIMIT_AUTH_WINDOW:-1m}
      MERCHTYL_IDEMPOTENCY_RETENTION: ${MERCHTYL_IDEMPOTENCY_RETENTION:-24h}
      MERCHTYL_IDEMPOTENCY_MAX_KEY_LENGTH: ${MERCHTYL_IDEMPOTENCY_MAX_KEY_LENGTH:-255}
      MERCHTYL_REGISTER_SESSIONS_SINGLE_OPEN_PER_REGISTER: ${MERCHTYL_REGISTER_SESSIONS_SINGLE_OPEN_PER_REGISTER:-true}
      MERCHTYL_REGISTER_SESSIONS_SINGLE_OPEN_PER_DEVICE: ${MERCHTYL_REGISTER_SESSIONS_SINGLE_OPEN_PER_DEVICE:-true}
      MERCHTYL_CASH_MOVEMENTS_APPROVAL_REQUIRED_TYPES: ${MERCHTYL_CASH_MOVEMENTS_APPROVAL_REQUIRED_TYPES:-SAFE_DROP,FLOAT_REMOVE,EXPENSE,BANK_DEPOSIT,CORRECTION}
      MERCHTYL_REFUNDS_APPROVAL_REQUIRED: ${MERCHTYL_REFUNDS_APPROVAL_REQUIRED:-false}
      SERVER_PORT: 8080
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      - "${HTTP_PORT:-80}:8080"

volumes:
  postgres-data:
